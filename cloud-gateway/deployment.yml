apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-gateway
  labels:
    app: cloud-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-gateway
  template:
    metadata:
      labels:
        app: cloud-gateway
    spec:
      containers:
      - name: cloud-gateway
        image: surenrjs/cloud-gateway:${IMAGE_TAG}
        ports:
        - containerPort: 8090
