spring:
  application:
    name: ARV-CLOUD-GATEWAY
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - AddResponseHeader=Access-Control-Allow-Origin, *

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

      routes:
        - id: arv-admin-service
          uri: lb://ARV-IDENTITY-SERVICE
          predicates:
            - Path=/admin/**, /auth
          filters:
            - AdminFilter

        - id: arv-identity-service
          uri: lb://ARV-IDENTITY-SERVICE
          predicates:
            - Path=/help, /auth/**, /swagger-ui/**, /v3/**, /address, /address/**, /wishlist, /wishlist/**, /cart, /cart/**, /orders, /orders/**, /features, /features/**, /homeBanner, /homeBanner/**, /api, /api/**, /couponCode, /couponCode/**
          filters:
            - name: CircuitBreaker
              args:
                name: arv-identity-service
                fallbackuri: forward:/authFallBack

        - id: arv-product-manager-service
          uri: lb://ARV-PRODUCT-SERVICE
          predicates:
            - Path=/products, /productCategories, /productSubCategories, /products/**, /productCategories/**, /productSubCategories/**,
          filters:
            - ManagerFilter

        - id: arv-product-service
          uri: lb://ARV-PRODUCT-SERVICE
          predicates:
            - Path=/, /help, /public/**, /swagger-ui/**, /v3/**, /store, /store/**
          filters:
            - name: CircuitBreaker
              args:
                name: arv-product-service
                fallbackuri: forward:/productFallBack
server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: hystrix.stream

hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds: 20000
ribbon:
  ConnectTimeout: 20000
  ReadTimeout: 20000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://85.31.233.21:8761/eureka
  instance:
    hostname: 85.31.233.21


