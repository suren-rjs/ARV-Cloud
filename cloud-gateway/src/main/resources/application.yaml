spring:
  application:
    name: ARV-CLOUD-GATEWAY
    gateway:
      routes:
        - id: arv-user-service
          uri: lb://ARV-USER-SERVICE
          predicates:
            - Path=/users/**, /admin/**, /notification/**, /auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: arv-user-service
                fallbackuri: forward:/userFallBack
        - id: arv-product-service
          uri: lb://ARV-PRODUCT-SERVICE
          predicates:
            - Path=/help, /public/**, /products/**, /productCategories/**, /productSubCategories/**, /productSubSubCategories/**
          filters:
            - name: CircuitBreaker
              args:
                name: arv-product-service
                fallbackuri: forward:/productFallBack
